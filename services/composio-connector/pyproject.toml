[project]
name = "rocky-composio-connector"
version = "0.1.0"
description = "Connector-only Composio sidecar for Rocky"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4",
  "asyncpg>=0.29",
  "composio==0.17.1",
  "cryptography>=45",
  "fastapi>=0.111",
  "joserfc>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rocky_connector"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"src/rocky_connector/app.py" = ["B008"]
"tests/**" = ["S101", "S105", "S106"]
